<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP Integrador Rick and Morty API</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  
  <body>

    <!-- navBar -->
    
    <ul class="nav nav-tabs justify-content-center">
      <div clas="container-fluid ">
        <img src="./klipartz.com.png" alt="RickAndMory logo" width="150" height="60">
      </div>
    </ul>

    <!-- fltrado -->
    
    <div class="container d-flex justify-content-center my-4">
      
      <form id="filtradoForm" class="row g-3 justify-content-center">
        
      <div class="col-md-4">
          <label for="status" class="form-label">Estado</label>
          <select id="status" name="status" class="form-select" required>
              <option value="">-- Seleccionar --</option>
              <option value="alive">Alive</option>
              <option value="dead">Dead</option>
              <option value="unknown">Unknown</option>
          </select>
      </div>

      <div class="col-md-4">
          <label for="gender" class="form-label">Género</label>
          <select id="gender" name="gender" class="form-select">
              <option value="">-- Cualquiera --</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="genderless">Genderless</option>
              <option value="unknown">Unknown</option>
          </select>
      </div>

      <div class="col-md-4">
          <label for="species" class="form-label">Especie</label>
          <select id="species" name="species" class="form-select">
            <option value="">-- Cualquiera --</option>
              <option value="Human">Humano</option>
              <option value="Alien">Alienigena</option>
              <option value="Humanoid">Humanoide</option>
              <option value="Poopybutthole">Poopybutthole</option>
              <option value="Mythological Creature">Criatura mitológica</option>
              <option value="Animal">Animal</option>
              <option value="Robot">Robot</option>
              <option value="Cronenberg">Cronenberg</option>
              <option value="Disease">Disease</option>
              <option value="unknown">Desconocido</option>
          </select>
      </div>

      <div class="d-flex justify-content-center">
          <button id='botonFiltro' type="submit" class="btn btn-outline-secondary">Filtrar</button>
      </div>
  </form>
</div>

    <!-- Carta personajes -->

    <div id="contenedorPersonajes" class="d-flex flex-wrap justify-content-center gap-3 my-4"></div> 

    <!-- botones paginado -->
    
    <div class="d-flex justify-content-center gap-2 my-4">
      <button id="btnAnterior" type="button" class="btn btn-outline-secondary">Anterior</button>
      <button id="btnSiguiente" type="button" class="btn btn-outline-secondary">Siguiente</button>
    </div>

    <!-- Ventana modal -->

    <div class="modal fade" id="modalPersonaje" tabindex="-1" aria-labelledby="modalPersonajeLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="modalPersonajeLabel">Detalles del personaje</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body" id="modalContenido">
            
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
