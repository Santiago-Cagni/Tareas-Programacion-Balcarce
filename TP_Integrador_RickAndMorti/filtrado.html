<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <ul class="nav nav-tabs" style="justify-content: center;">
        <img src="./klipartz.com.png" alt="Bootstrap" width="110" height="40">
        <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="./index.html">Todos los personajes</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="">Filtro de personajes</a>
        </li>
    </ul>

    <h2>Filtrar personajes</h2>

    <form id="formFiltro" class="row g-3">
        <!-- Status (requerido) -->
        <div class="col-md-3">
            <label for="status" class="form-label">Estado *</label>
            <select id="status" name="status" class="form-select" required>
                <option value="">-- Seleccionar --</option>
                <option value="alive">Alive</option>
                <option value="dead">Dead</option>
                <option value="unknown">Unknown</option>
            </select>
        </div>

        <!-- Nombre  -->
        <div class="col-md-3">
            <label for="name" class="form-label">Nombre</label>
            <input type="text" id="name" name="name" class="form-control" />
        </div>

        <!-- Género -->
        <div class="col-md-3">
            <label for="gender" class="form-label">Género</label>
            <select id="gender" name="gender" class="form-select">
                <option value="">-- Cualquiera --</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="genderless">Genderless</option>
                <option value="unknown">Unknown</option>
            </select>
        </div>

        <!-- Especie -->
        <div class="col-md-3">
            <label for="species" class="form-label">Especie</label>
            <input type="text" id="species" name="species" class="form-control" />
        </div>

        <!-- Tipo -->
        <div class="col-md-3">
            <label for="type" class="form-label">Tipo</label>
            <input type="text" id="type" name="type" class="form-control" />
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Filtrar</button>
        </div>
    </form>


    <script type="module" src="./main.js"></script>


</body>

</html>
